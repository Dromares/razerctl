[package]
name = "razerctl"
version = "0.3.1"
edition = "2021"
description = "Linux rewrite of the Razer Synapse device-control core (Protocol25 over hidraw / OpenRazer sysfs)"
license = "MIT"
repository = "https://github.com/Dromares/razerctl"

[dependencies]
eframe = "0.36"
evdev = "0.13"
libc = "0.2"
miniz_oxide = "0.8"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
strip = true

# AppImage: `cargo install cargo-packager --locked --version 0.11.8`, then
# `cargo build --release --locked`, then `cargo run --release --locked --example fetch_appimage_tools -- cargo packager --release
# --formats appimage` (the example sha256-checks the packager's build tools first; see README,
# "AppImage"). razerctl-gui is the entry point; the CLI rides along in usr/bin. The version is [package].version: the packager
# fills it in when omitted (cargo-packager src/cli/config.rs), so it is not repeated here.
[package.metadata.packager]
product-name = "razerctl"
identifier = "io.github.dromares.razerctl"
description = "Razer mouse control for Linux: onboard button remapping, DPI, polling rate and battery"
authors = ["Dromares"]
license-file = "LICENSE"
category = "Utility"
homepage = "https://github.com/Dromares/razerctl"
out-dir = "target/packager"
binaries-dir = "target/release"
binaries = [
    { path = "razerctl-gui", main = true },
    { path = "razerctl" },
]
icons = ["packaging/razerctl.png"]
formats = ["appimage"]

# The desktop entry is packaging/razerctl.desktop verbatim (the packager would otherwise generate one named
# after the main binary, with Icon=razerctl-gui). Its Icon=razerctl is satisfied by the two icon files below.
[package.metadata.packager.linux]
generate-desktop-entry = false

[package.metadata.packager.appimage]
files = { "packaging/razerctl.desktop" = "usr/share/applications/razerctl-gui.desktop", "packaging/razerctl.png" = "usr/share/icons/hicolor/256x256/apps/razerctl.png", "packaging/razerctl.svg" = "usr/share/icons/hicolor/scalable/apps/razerctl.svg" }
# razerctl-gui loads these at run time (dlopen). They must come from the host's drivers, never from the build base.
excluded-libraries = ["libGL*", "libGLX*", "libGLdispatch*", "libOpenGL*", "libEGL*", "libGLESv2*", "libgbm*", "libdrm*", "libvulkan*", "libwayland-*", "libX11*", "libXcursor*", "libXi*", "libXrandr*", "libxcb*", "libxkbcommon*"]
